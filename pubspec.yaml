name: mobileappsfc
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  file_saver: ^0.2.14
  supabase_flutter: ^2.18.3
  http: ^1.2.2
  share_plus: ^11.0.0
  google_sign_in: 6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/sfc_icon.png
    - assets/sfc_lockup.png

# App icon configuration (must be at the root level)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/sfc_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
